<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <pattern id="grid-nav" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#121d17" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#080e0a" />
  <rect width="1200" height="800" fill="url(#grid-nav)" opacity="0.8" />

  <!-- Header -->
  <g transform="translate(60, 60)">
    <text font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#1ed760" letter-spacing="3">DESKTOP EMBEDDED TELEMETRY // MULTI-MODE OLED</text>
    <text y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Navigator 01 · ESP32 Smart OLED Companion</text>
    <text y="52" font-family="'JetBrains Mono', monospace" font-size="12" fill="#588169">SSD1306 128x64 OLED + CAPACITIVE TOUCH (GPIO 33) + SPOTIFY OAUTH BOUNCE + GOOGLE MAPS TURN-BY-TURN</text>
  </g>

  <!-- Left: OLED Display with Spotify & Pixel Animation -->
  <g transform="translate(60, 160)">
    <rect width="520" height="380" rx="16" fill="#0e1712" stroke="#1ed760" stroke-width="2.5" />
    <rect x="24" y="24" width="472" height="332" rx="10" fill="#030805" stroke="#1ed760" stroke-width="1" />

    <!-- OLED Screen Content -->
    <g transform="translate(50, 50)" font-family="'JetBrains Mono', monospace">
      <!-- Mode 1: Spotify Telemetry Mode -->
      <g>
        <circle cx="16" cy="16" r="12" fill="#1ed760" />
        <path d="M 8 13 Q 16 10 24 13 M 10 16 Q 16 14 22 16 M 12 19 Q 16 18 20 19" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" />
        <text x="36" y="20" font-size="13" font-weight="700" fill="#1ed760">SPOTIFY ACTIVE</text>
        <text x="420" y="20" text-anchor="end" font-size="11" fill="#88bba0">NTP 18:42:09</text>
      </g>

      <line x1="0" y1="40" x2="420" y2="40" stroke="#1ed760" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

      <!-- Song title & artist -->
      <text y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff">Starboy (feat. Daft Punk)</text>
      <text y="106" font-family="'JetBrains Mono', monospace" font-size="13" fill="#a0aec0">The Weeknd — Starboy</text>

      <!-- Progress bar -->
      <g transform="translate(0, 130)">
        <rect width="420" height="4" rx="2" fill="#1a2e22" />
        <rect width="260" height="4" rx="2" fill="#1ed760" />
        <circle cx="260" cy="2" r="5" fill="#ffffff" />
        <text y="24" font-size="10" fill="#a0aec0">02:18</text>
        <text x="420" y="24" text-anchor="end" font-size="10" fill="#a0aec0">03:50</text>
      </g>

      <!-- Turn By Turn Navigation Sub-overlay -->
      <g transform="translate(0, 190)">
        <rect width="420" height="75" rx="8" fill="#08140c" stroke="#1ed760" stroke-width="1" />
        <g transform="translate(20, 48)">
          <!-- Arrow Right -->
          <polygon points="0,0 20,-15 20,-6 40,-6 40,6 20,6 20,15" fill="#ffd600" />
          <text x="55" y="-5" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Turn Right onto Mavoor Rd</text>
          <text x="55" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffd600">IN 120 METERS</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right: 7-Mode Pixel Art Animation Reel -->
  <g transform="translate(620, 160)">
    <rect width="520" height="380" rx="16" fill="#0e1712" stroke="#2d4233" stroke-width="1.5" />
    <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#1ed760">CAPACITIVE TOUCH MODES (GPIO 33)</text>
    <text x="24" y="56" font-family="'JetBrains Mono', monospace" font-size="10" fill="#588169">TOUCH CYCLE ACROSS 7 PROCEDURAL BITMAP STATE ENGINES</text>

    <g transform="translate(24, 85)" font-family="'JetBrains Mono', monospace">
      <!-- 7 Modes Grid -->
      <g transform="translate(0, 0)">
        <rect width="220" height="50" rx="6" fill="#15261b" stroke="#1ed760" />
        <text x="14" y="22" font-size="11" font-weight="700" fill="#1ed760">01. DASAI MOCHI</text>
        <text x="14" y="38" font-size="10" fill="#88bba0">40ms frame cadence</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="50" rx="6" fill="#15261b" stroke="#2d4233" />
        <text x="14" y="22" font-size="11" font-weight="700" fill="#ffffff">02. OLED MAKER</text>
        <text x="14" y="38" font-size="10" fill="#718096">83ms frame cadence</text>
      </g>

      <g transform="translate(0, 65)">
        <rect width="220" height="50" rx="6" fill="#15261b" stroke="#2d4233" />
        <text x="14" y="22" font-size="11" font-weight="700" fill="#ffffff">03. EXPRESSIVE EYES</text>
        <text x="14" y="38" font-size="10" fill="#718096">450ms blink cycle</text>
      </g>

      <g transform="translate(240, 65)">
        <rect width="220" height="50" rx="6" fill="#15261b" stroke="#2d4233" />
        <text x="14" y="22" font-size="11" font-weight="700" fill="#ffffff">04. HANDS WAVE</text>
        <text x="14" y="38" font-size="10" fill="#718096">303ms gesture cycle</text>
      </g>

      <g transform="translate(0, 130)">
        <rect width="220" height="50" rx="6" fill="#15261b" stroke="#2d4233" />
        <text x="14" y="22" font-size="11" font-weight="700" fill="#ffffff">05. FLAG WAVING</text>
        <text x="14" y="38" font-size="10" fill="#718096">365ms wind cycle</text>
      </g>

      <g transform="translate(240, 130)">
        <rect width="220" height="50" rx="6" fill="#15261b" stroke="#2d4233" />
        <text x="14" y="22" font-size="11" font-weight="700" fill="#ffffff">06. ORBIT SPHERE</text>
        <text x="14" y="38" font-size="10" fill="#718096">386ms 3D rotation</text>
      </g>

      <g transform="translate(0, 195)">
        <rect width="460" height="50" rx="6" fill="#15261b" stroke="#ffd600" />
        <text x="14" y="22" font-size="11" font-weight="700" fill="#ffd600">07. COMPASS HEADING</text>
        <text x="14" y="38" font-size="10" fill="#cbe4ff">221ms turn-by-turn dynamic arrow rendering</text>
      </g>
    </g>
  </g>

  <!-- Architecture Banner -->
  <g transform="translate(60, 580)">
    <rect width="1080" height="150" rx="12" fill="#0c1710" stroke="#1ed760" stroke-width="1.5" />
    <text x="30" y="36" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#1ed760">WEB APIS &amp; LOCAL NETWORK ARCHITECTURE</text>
    <g transform="translate(30, 60)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e0">
      <text y="0">• WebServer(80) SoftAP Portal: Non-blocking WiFi manager allows instant LAN onboarding.</text>
      <text y="24">• Spotify Bounce Bridge: Overcomes mixed-content HTTPS restrictions via local top-level redirect.</text>
      <text y="48">• Navigation Companion: Relays browser geolocation + Google Maps API to ESP32 over HTTP GET.</text>
    </g>
  </g>
</svg>