<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <pattern id="grid-wttd" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#162233" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1000" height="650" fill="#080e18" />
  <rect width="1000" height="650" fill="url(#grid-wttd)" opacity="0.6" />

  <g transform="translate(40, 40)">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00d2ff" letter-spacing="2">OPTICAL BENCH CALIBRATION PIPELINE</text>
    <text y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Geometry Setup: Tripod Mount, Pinhole Focal Ray &amp; Table Plane</text>
  </g>

  <g transform="translate(60, 110)">
    <!-- Tripod / Camera at Top -->
    <rect x="360" y="20" width="280" height="80" rx="8" fill="#142033" stroke="#00d2ff" stroke-width="2" />
    <circle cx="500" cy="60" r="14" fill="#00d2ff" />
    <circle cx="500" cy="60" r="6" fill="#080e18" />
    <text x="500" y="90" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">PHONE / WEBCAM LENS</text>

    <!-- Pinhole Projection Rays -->
    <path d="M 500 60 L 160 380 L 840 380 Z" fill="#00d2ff" fill-opacity="0.05" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="4 2" />

    <!-- Height Measurement Dimension Line -->
    <line x1="320" y1="60" x2="320" y2="380" stroke="#ffd600" stroke-width="2" />
    <polygon points="320,60 315,75 325,75" fill="#ffd600" />
    <polygon points="320,380 315,365 325,365" fill="#ffd600" />
    <text x="300" y="225" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffd600">H = 52.5 cm</text>

    <!-- Table Surface Plane -->
    <rect x="100" y="380" width="800" height="40" rx="4" fill="#1b283d" stroke="#4a5d78" />
    <text x="500" y="405" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">WORKBENCH SURFACE PLANE (Z = 0)</text>

    <!-- Origin and Object on Table -->
    <circle cx="500" cy="380" r="6" fill="#ff3366" />
    <text x="500" y="440" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff3366">Origin (cx, cy)</text>

    <rect x="680" y="360" width="50" height="20" rx="3" fill="#00ff88" />
    <text x="705" y="440" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00ff88">Tracked Target</text>
  </g>

  <!-- Footnote -->
  <g transform="translate(60, 520)">
    <rect width="880" height="70" rx="8" fill="#0e1724" stroke="#162233" />
    <text x="24" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00d2ff">CALIBRATION COMMAND WORKFLOW:</text>
    <text x="24" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbe4ff">
      Press 'k' → click two tick marks on table ruler → type physical distance in cm → focal_px locked into JSON.
    </text>
  </g>
</svg>