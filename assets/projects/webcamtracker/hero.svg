<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <pattern id="grid-wt" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16202e" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#080e18" />
  <rect width="1200" height="800" fill="url(#grid-wt)" opacity="0.8" />

  <!-- Header -->
  <g transform="translate(60, 60)">
    <text font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00d2ff" letter-spacing="3">COMPUTER VISION // PINHOLE PROJECTION &amp; METRIC CALIBRATION</text>
    <text y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Webcam Coordinate Tracker · Optical 2D Measuring</text>
    <text y="52" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5c7699">OPENCV + PINHOLE PROJECTION [X = (u - cx)*H/f] + INTERACTIVE RULER ZOOM INSET + REAL-TIME CENTIMETERS</text>
  </g>

  <!-- Left: Live OpenCV Tracking Camera Feed -->
  <g transform="translate(60, 160)">
    <rect width="520" height="380" rx="16" fill="#0f1926" stroke="#00d2ff" stroke-width="2.5" />
    <rect x="20" y="20" width="480" height="340" rx="10" fill="#040912" />

    <!-- Virtual Origin Crosshair (0,0) -->
    <g transform="translate(260, 190)">
      <circle r="4" fill="#ff3366" />
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#ff3366" stroke-width="1.5" stroke-dasharray="3 2" />
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#ff3366" stroke-width="1.5" stroke-dasharray="3 2" />
      <text x="10" y="-8" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff3366">ORIGIN (0,0)</text>
    </g>

    <!-- Detected Object on Table -->
    <g transform="translate(370, 110)">
      <rect x="-35" y="-25" width="70" height="50" rx="4" fill="#0d2822" stroke="#00ff88" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#00ff88" />
      <text x="0" y="-32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00ff88">OBJECT DETECTED</text>
      
      <!-- Coordinate readout overlay -->
      <g transform="translate(42, 5)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff">
        <text y="0">X: +14.2 cm</text>
        <text y="14">Y: -10.8 cm</text>
        <text y="28" fill="#ffd600">R:  17.8 cm</text>
      </g>
    </g>

    <!-- Vector line from origin to object -->
    <line x1="260" y1="190" x2="370" y2="110" stroke="#ffd600" stroke-width="1.5" stroke-dasharray="4 2" />

    <!-- Magnifier Zoom Inset (Calibration Tool) -->
    <g transform="translate(40, 210)">
      <rect width="130" height="130" rx="8" fill="#142033" stroke="#ffd600" stroke-width="2" />
      <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ffd600">6X RULER ZOOM</text>
      <!-- Ruler tick simulation in inset -->
      <line x1="20" y1="70" x2="110" y2="70" stroke="#cbd5e0" stroke-width="2" />
      <line x1="30" y1="55" x2="30" y2="85" stroke="#00ff88" stroke-width="2" />
      <line x1="90" y1="55" x2="90" y2="85" stroke="#00ff88" stroke-width="2" />
      <text x="60" y="105" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00ff88">Δ = 10.0 cm</text>
    </g>
  </g>

  <!-- Right: Pinhole Projection Formula Breakdown -->
  <g transform="translate(620, 160)">
    <rect width="520" height="380" rx="16" fill="#0f1926" stroke="#2d3d54" stroke-width="1.5" />
    <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00d2ff">PINHOLE CAMERA PROJECTION MATHEMATICS</text>
    
    <g transform="translate(24, 70)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e0">
      <rect width="470" height="75" rx="8" fill="#060c14" stroke="#00d2ff" stroke-dasharray="3 2" />
      <text x="20" y="30" font-size="13" font-weight="700" fill="#ffffff">X_cm = (u - cx) * H / f</text>
      <text x="20" y="55" font-size="13" font-weight="700" fill="#ffffff">Y_cm = (v - cy) * H / f</text>
    </g>

    <g transform="translate(24, 175)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a0aec0">
      <text y="0"><tspan fill="#00d2ff">(u, v)</tspan>   : Pixel coordinates of detected contour centroid</text>
      <text y="24"><tspan fill="#ff3366">(cx, cy)</tspan> : Virtual origin (center of sensor frame, W/2, H/2)</text>
      <text y="48"><tspan fill="#ffd600">H</tspan>        : Measured camera height above table (e.g. 52.5 cm)</text>
      <text y="72"><tspan fill="#00ff88">f</tspan>        : Exact calibrated focal length in pixels</text>
      <text y="96"><tspan fill="#ffffff">MOG2</tspan>     : Dynamic background subtraction for motion rejection</text>
    </g>

    <g transform="translate(24, 305)">
      <rect width="470" height="50" rx="6" fill="#14261d" stroke="#00ff88" />
      <text x="16" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00ff88">
        ✓ Calibration saved to camera_calibration.json
      </text>
    </g>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(60, 580)">
    <rect width="1080" height="150" rx="12" fill="#0a121e" stroke="#16202e" />
    <text x="30" y="36" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffd600">WI-FI IP CAMERA SUPPORT</text>
    <g transform="translate(30, 60)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899aa">
      <text y="0">• Connects directly to mobile phone IP camera streams (e.g. http://192.168.1.x:4747/video) or USB UVC.</text>
      <text y="24">• Non-blocking background calibration thread allows video feed to stay alive during CLI distance prompt.</text>
      <text y="48">• Sub-millimeter tracking accuracy verified across 0–50cm table coordinate planes.</text>
    </g>
  </g>
</svg>