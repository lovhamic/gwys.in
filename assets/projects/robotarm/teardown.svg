<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <pattern id="grid-ratd" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a202c" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1000" height="650" fill="#0b0e14" />
  <rect width="1000" height="650" fill="url(#grid-ratd)" opacity="0.6" />

  <g transform="translate(40, 40)">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffd600" letter-spacing="2">UNIFIED WIRING &amp; HIGH-CURRENT SCHEMATIC</text>
    <text y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff">ESP32-WROOM-32 GPIO Map, ACS712 Current Path &amp; 5x Servos</text>
  </g>

  <!-- Wiring Diagram Content -->
  <g transform="translate(60, 110)">
    <!-- 5V 6A Power Supply -->
    <rect x="0" y="20" width="220" height="150" rx="8" fill="#141a24" stroke="#e53e3e" stroke-width="2" />
    <text x="20" y="50" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#e53e3e">5V 6A PSU</text>
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a0aec0">HIGH CURRENT RAIL</text>
    <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff">RED: +5V Rail</text>
    <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#718096">BLACK: Common GND</text>

    <!-- ACS712 Sensor -->
    <rect x="280" y="20" width="200" height="150" rx="8" fill="#141a24" stroke="#00e5ff" stroke-width="2" />
    <text x="20" y="50" transform="translate(280, 20)" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#00e5ff">ACS712</text>
    <text x="20" y="70" transform="translate(280, 20)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a0aec0">HALL EFFECT SENSOR</text>
    <g transform="translate(300, 110)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e0">
      <text y="0">IP+ : PSU In</text>
      <text y="20">IP- : Breadboard Rail</text>
      <text y="40">OUT : GPIO 34 (Divider)</text>
    </g>

    <!-- ESP32-WROOM-32 Microcontroller -->
    <rect x="540" y="20" width="380" height="420" rx="10" fill="#141a24" stroke="#ffd600" stroke-width="2" />
    <text x="730" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#ffd600">ESP32-WROOM-32</text>
    <text x="730" y="75" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#718096">GPIO ALLOCATION MAP</text>

    <g transform="translate(570, 110)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">
      <text y="0"><tspan fill="#ffd600">GPIO 12</tspan> ──── Servo 1 (Base Rotation)</text>
      <text y="28"><tspan fill="#ffd600">GPIO 13</tspan> ──── Servo 2 (Shoulder)</text>
      <text y="56"><tspan fill="#ffd600">GPIO 14</tspan> ──── Servo 3 (Elbow)</text>
      <text y="84"><tspan fill="#ffd600">GPIO 15</tspan> ──── Servo 4 (Wrist Pitch)</text>
      <text y="112"><tspan fill="#00e5ff">GPIO 16</tspan> ──── Servo 5 (SG90 Gripper)</text>
      <text y="140"><tspan fill="#68d391">GPIO 17</tspan> ──── HC-SR04 TRIG Pulse</text>
      <text y="168"><tspan fill="#68d391">GPIO 5</tspan>  ──── HC-SR04 ECHO (1k:2k Divider)</text>
      <text y="196"><tspan fill="#f687b3">GPIO 34</tspan> ──── ACS712 OUT (10k:10k Divider)</text>
      <text y="224"><tspan fill="#ecc94b">GPIO 4</tspan>  ──── WS2812B RGB Feedback DIN</text>
      <text y="252"><tspan fill="#718096">GND</tspan>    ──── Blue Rail Common Ground</text>
    </g>

    <!-- 5x Servos Block -->
    <rect x="0" y="240" width="480" height="200" rx="8" fill="#111622" stroke="#2d3748" />
    <text x="24" y="270" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">ACTUATION CLUSTER (4x MG996R + 1x SG90)</text>
    <g transform="translate(24, 300)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a0aec0">
      <text y="0">All Servo RED wires tied to Breadboard +5V Rail</text>
      <text y="24">All Servo BROWN wires tied to Breadboard GND</text>
      <text y="48">1000uF Electrolytic Capacitor installed across rails</text>
      <text y="72" fill="#ffd600">Signal wires isolated from high inductive kickback</text>
    </g>
  </g>

  <!-- Footnote -->
  <g transform="translate(60, 560)">
    <text font-family="'JetBrains Mono', monospace" font-size="11" fill="#718096">
      SAFETY NOTE: ESP32 ADC is 3.3V max. Voltage dividers on Echo (5V to 3.3V) and ACS712 (5V to 2.5V) prevent over-voltage.
    </text>
  </g>
</svg>