<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <pattern id="grid-td" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222733" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1000" height="650" fill="#0d1117" />
  <rect width="1000" height="650" fill="url(#grid-td)" opacity="0.6" />

  <!-- Title / Label -->
  <g transform="translate(40, 40)">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffd600" letter-spacing="2">WIRING SCHEMATIC // HARDWARE BUS</text>
    <text y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff">ESP32-C3 Supermini Pinout &amp; I2C/UART Distribution</text>
  </g>

  <!-- Central ESP32 Microcontroller -->
  <g transform="translate(360, 110)">
    <rect width="280" height="420" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect x="20" y="20" width="240" height="380" rx="8" fill="#0d1117" stroke="#238636" stroke-dasharray="3 3" />
    
    <text x="140" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#3fb950">ESP32-C3</text>
    <text x="140" y="75" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8b949e">SUPERMINI FORM-FACTOR</text>

    <!-- Pin Headers Left -->
    <g transform="translate(20, 110)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9d1d9">
      <text y="0"><tspan fill="#f85149">3.3V</tspan> ──── Power Bus</text>
      <text y="35"><tspan fill="#f85149">5V</tspan>   ──── VCC In (Regulated)</text>
      <text y="70"><tspan fill="#8b949e">GND</tspan>  ──── Common Ground</text>
      <text y="105"><tspan fill="#58a6ff">IO20</tspan> ──── GPS RX</text>
      <text y="140"><tspan fill="#58a6ff">IO21</tspan> ──── GPS TX</text>
      <text y="175"><tspan fill="#e3b341">IO8</tspan>  ──── I2C SDA (OLED + MPU)</text>
      <text y="210"><tspan fill="#e3b341">IO9</tspan>  ──── I2C SCL (OLED + MPU)</text>
    </g>

    <!-- Center Status Indicator -->
    <circle cx="140" cy="355" r="5" fill="#3fb950" />
    <text x="140" y="380" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8b949e">SYSTEM ACTIVE</text>
  </g>

  <!-- Left: NEO-6M GPS Block -->
  <g transform="translate(40, 150)">
    <rect width="250" height="180" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#58a6ff">NEO-6M GPS</text>
    <text x="20" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8b949e">UART 9600 BAUD</text>
    
    <g transform="translate(20, 85)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9d1d9">
      <text y="0">VCC  → 5V (Board Reg)</text>
      <text y="24">GND  → Ground Rail</text>
      <text y="48">TX   → GPIO 20 (RX)</text>
      <text y="72">RX   → GPIO 21 (TX)</text>
    </g>
  </g>

  <!-- Left Lower: MPU6050 IMU Block -->
  <g transform="translate(40, 360)">
    <rect width="250" height="180" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="1.5" />
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#e3b341">MPU6050 IMU</text>
    <text x="20" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8b949e">RAW I2C (ADDR 0x68)</text>

    <g transform="translate(20, 85)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9d1d9">
      <text y="0">VCC  → 3.3V / 5V</text>
      <text y="24">GND  → Ground Rail</text>
      <text y="48">SDA  → GPIO 8 (Shared)</text>
      <text y="72">SCL  → GPIO 9 (Shared)</text>
    </g>
  </g>

  <!-- Right: 1.3" OLED SH1106 Display Block -->
  <g transform="translate(710, 240)">
    <rect width="250" height="200" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="1.5" />
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#79c0ff">1.3" OLED DISPLAY</text>
    <text x="20" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8b949e">SH1106 CONTROLLER (I2C)</text>

    <g transform="translate(20, 90)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9d1d9">
      <text y="0">VCC  → 3.3V Power</text>
      <text y="24">GND  → Ground Rail</text>
      <text y="48">SDA  → GPIO 8 (Shared)</text>
      <text y="72">SCL  → GPIO 9 (Shared)</text>
      <text y="96">RES  → 128x64 Monochrome</text>
    </g>
  </g>

  <!-- Connection Traces (Clean Hairline Buses) -->
  <path d="M 290 230 L 360 215" stroke="#58a6ff" stroke-width="2" fill="none" />
  <path d="M 290 440 L 360 285" stroke="#e3b341" stroke-width="2" fill="none" />
  <path d="M 640 285 L 710 325" stroke="#79c0ff" stroke-width="2" fill="none" />

  <!-- Footnote -->
  <text x="500" y="585" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">
    NOTE: Shared I2C bus utilizes hardware pullups. AD0 pin tied to GND for address 0x68.
  </text>
</svg>