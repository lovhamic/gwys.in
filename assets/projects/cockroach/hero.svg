<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <pattern id="grid-ck" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f1816" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="#38251e"/>
    </pattern>
    <filter id="glow-ck" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#0d0908" />
  <rect width="1200" height="800" fill="url(#grid-ck)" opacity="0.8" />

  <!-- Header -->
  <g transform="translate(60, 60)">
    <text font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#ff6b4a" letter-spacing="3">PHYSICAL ARCADE TELEMETRY // HARDWARE CONTROLLER</text>
    <text y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Shoot the Cockroach · ESP32 Physical IMU Gun</text>
    <text y="52" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8f7a75">6-AXIS GYRO/ACCELEROMETER STREAMING AT 100Hz OVER USB SERIAL (115200 BAUD) TO PYGAME</text>
  </g>

  <!-- Left: Pygame Arcade Screen Render -->
  <g transform="translate(60, 160)">
    <rect width="520" height="360" rx="14" fill="#140e0c" stroke="#4a251b" stroke-width="3" />
    <rect x="20" y="20" width="480" height="320" rx="8" fill="#080504" stroke="#ff4500" stroke-width="1.5" />

    <!-- Screen HUD -->
    <g transform="translate(40, 50)" font-family="'JetBrains Mono', monospace">
      <text font-size="12" fill="#ff4500" font-weight="700">SCORE: 1,450</text>
      <text x="440" text-anchor="end" font-size="12" fill="#ffd600">LIVES: ♥ ♥ ♥</text>
      <line x1="0" y1="16" x2="440" y2="16" stroke="#4a251b" stroke-width="1" />

      <!-- Cockroach Target 1 -->
      <g transform="translate(140, 100)">
        <ellipse cx="0" cy="0" rx="18" ry="10" fill="#8B4513" stroke="#D2691E" stroke-width="1.5" />
        <line x1="-15" y1="-8" x2="-25" y2="-18" stroke="#D2691E" stroke-width="1.5" />
        <line x1="-8" y1="-10" x2="-14" y2="-22" stroke="#D2691E" stroke-width="1.5" />
        <line x1="15" y1="-8" x2="25" y2="-18" stroke="#D2691E" stroke-width="1.5" />
        <line x1="-15" y1="8" x2="-25" y2="18" stroke="#D2691E" stroke-width="1.5" />
        <line x1="15" y1="8" x2="25" y2="18" stroke="#D2691E" stroke-width="1.5" />
        <!-- Antennae -->
        <path d="M 18 -4 Q 30 -12 36 -6" fill="none" stroke="#D2691E" stroke-width="1" />
        <path d="M 18 4 Q 30 12 36 6" fill="none" stroke="#D2691E" stroke-width="1" />
      </g>

      <!-- Cockroach Target 2 (Running) -->
      <g transform="translate(340, 190) rotate(35)">
        <ellipse cx="0" cy="0" rx="16" ry="9" fill="#8B4513" stroke="#D2691E" stroke-width="1.5" />
        <line x1="-12" y1="-8" x2="-22" y2="-16" stroke="#D2691E" stroke-width="1.5" />
        <line x1="12" y1="-8" x2="22" y2="-16" stroke="#D2691E" stroke-width="1.5" />
        <line x1="-12" y1="8" x2="-22" y2="16" stroke="#D2691E" stroke-width="1.5" />
        <line x1="12" y1="8" x2="22" y2="16" stroke="#D2691E" stroke-width="1.5" />
      </g>

      <!-- Crosshair (Locked on Target) -->
      <g transform="translate(260, 140)">
        <circle r="36" fill="none" stroke="#00ff66" stroke-width="1.5" filter="url(#glow-ck)" />
        <circle r="4" fill="#00ff66" />
        <line x1="-50" y1="0" x2="-10" y2="0" stroke="#00ff66" stroke-width="2" />
        <line x1="10" y1="0" x2="50" y2="0" stroke="#00ff66" stroke-width="2" />
        <line x1="0" y1="-50" x2="0" y2="-10" stroke="#00ff66" stroke-width="2" />
        <line x1="0" y1="10" x2="0" y2="50" stroke="#00ff66" stroke-width="2" />
        <text x="44" y="-12" font-size="10" fill="#00ff66">AIM LOCK [X:482, Y:310]</text>
      </g>

      <text y="270" font-size="10" fill="#a08078">STATUS: SERIAL LINK STABLE // REFRESH 100 FPS</text>
    </g>
  </g>

  <!-- Right: Physical Gun Controller Blueprint -->
  <g transform="translate(620, 160)">
    <!-- Gun Chassis Frame -->
    <path d="M 40 80 L 320 80 L 320 160 L 220 160 L 160 330 L 70 330 L 120 170 L 40 170 Z" 
          fill="#1c1412" stroke="#ff6b4a" stroke-width="2.5" stroke-dasharray="1 0" />
    
    <!-- Barrel MPU6050 Bay -->
    <rect x="230" y="95" width="75" height="50" rx="4" fill="#2d1d18" stroke="#ffd600" stroke-width="1.5" />
    <text x="267" y="122" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ffd600">MPU6050</text>
    <text x="267" y="136" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c0a090">6-AXIS IMU</text>

    <!-- Receiver ESP32 Bay -->
    <rect x="60" y="95" width="120" height="60" rx="6" fill="#182820" stroke="#00ff66" stroke-width="1.5" />
    <text x="120" y="125" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00ff66">ESP32 DEVKIT</text>
    <text x="120" y="142" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#88bba0">DUAL CORE 240MHz</text>

    <!-- Trigger Switch in Guard -->
    <path d="M 140 175 C 130 195 130 220 160 220" fill="none" stroke="#888888" stroke-width="3" />
    <circle cx="145" cy="195" r="7" fill="#ff4500" stroke="#ffffff" stroke-width="1.5" />
    <text x="175" y="200" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ff4500">TRIGGER (GPIO 4)</text>

    <!-- Grip & USB Cable -->
    <path d="M 115 330 C 115 380 200 370 260 410" fill="none" stroke="#718096" stroke-width="4" stroke-linecap="round" />
    <text x="275" y="415" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a0aec0">USB SERIAL (115200)</text>

    <!-- Spec Labels Overlay -->
    <g transform="translate(340, 100)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">
      <text y="0" font-weight="700" fill="#ffd600">HARDWARE MAPPING:</text>
      <text y="24"><tspan fill="#ff6b4a">GPIO 21</tspan> : I2C SDA (400kHz)</text>
      <text y="44"><tspan fill="#ff6b4a">GPIO 22</tspan> : I2C SCL (400kHz)</text>
      <text y="64"><tspan fill="#ff4500">GPIO 4</tspan>  : Tactile Trigger (Pullup)</text>
      <text y="84"><tspan fill="#00ff66">USB UART</tspan>: 10ms Packet Cadence</text>
      <text y="104"><tspan fill="#79c0ff">Pygame</tspan>  : Dynamic Crosshair Damping</text>
    </g>
  </g>

  <!-- Serial Packet Spec Bar (Bottom) -->
  <g transform="translate(60, 560)">
    <rect width="1080" height="150" rx="10" fill="#140e0c" stroke="#38251e" stroke-width="1.5" />
    <text x="30" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff6b4a" letter-spacing="2">REAL-TIME SERIAL PROTOCOL // PACKET FORMAT</text>
    
    <g transform="translate(30, 60)" font-family="'JetBrains Mono', monospace">
      <rect width="980" height="48" rx="6" fill="#080504" stroke="#ff4500" stroke-dasharray="3 2" />
      <text x="20" y="30" font-size="14" fill="#00ff66">DATA,&lt;ax&gt;,&lt;ay&gt;,&lt;az&gt;,&lt;gx&gt;,&lt;gy&gt;,&lt;gz&gt; \r\n</text>
      <text x="600" y="30" font-size="14" fill="#ff4500">SHOOT \r\n</text>
    </g>
    <text x="30" y="132" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8f7a75">
      Sampling gyro delta at 100Hz with exponential moving average filter. Zero latency physical trigger interrupt.
    </text>
  </g>
</svg>