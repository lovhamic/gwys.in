<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <pattern id="grid-sptd" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#182333" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1000" height="650" fill="#090b10" />
  <rect width="1000" height="650" fill="url(#grid-sptd)" opacity="0.6" />

  <g transform="translate(40, 40)">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2">OPTICAL PATH &amp; CALIBRATION DATA PIPELINE</text>
    <text y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Slit, Diffraction Grating, Sensor Array &amp; Savitzky-Golay Filter</text>
  </g>

  <g transform="translate(60, 110)">
    <!-- Light Source Slit -->
    <rect x="0" y="40" width="180" height="340" rx="8" fill="#141a24" stroke="#ffd600" stroke-width="1.5" />
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#ffd600">ENTRANCE SLIT</text>
    <text x="20" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">0.1mm RAZOR EDGE</text>
    <line x1="90" y1="130" x2="90" y2="300" stroke="#ffd600" stroke-width="3" stroke-dasharray="8 4" />
    <text x="90" y="340" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e0">Collimated Beam</text>

    <!-- Diffraction Grating -->
    <rect x="260" y="80" width="160" height="260" rx="8" fill="#141a24" stroke="#a78bfa" stroke-width="2" />
    <text x="340" y="115" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a78bfa">GRATING</text>
    <text x="340" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">1000 lines/mm</text>
    <line x1="280" y1="160" x2="400" y2="160" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="280" y1="190" x2="400" y2="190" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="280" y1="220" x2="400" y2="220" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="280" y1="250" x2="400" y2="250" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Dispersed Rays to Sensor -->
    <path d="M 420 180 L 560 120" stroke="#38bdf8" stroke-width="2" />
    <path d="M 420 210 L 560 210" stroke="#10b981" stroke-width="2" />
    <path d="M 420 240 L 560 300" stroke="#ef4444" stroke-width="2" />

    <!-- Camera Sensor -->
    <rect x="560" y="60" width="320" height="300" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="2" />
    <text x="720" y="95" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#38bdf8">CMOS SENSOR &amp; PYTHON</text>
    
    <g transform="translate(590, 140)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">
      <text y="0">1. ROI Crop &amp; Grayscale Intensity</text>
      <text y="26">2. Savitzky-Golay Filter (window=11)</text>
      <text y="52">3. Two-Point Wavelength Fit:</text>
      <text y="78" fill="#ffd600">   λ(x) = λ1 + (x - x1) * dλ/dx</text>
      <text y="104">4. PeakUtils: threshold=0.15, min_dist=10</text>
      <text y="130" fill="#10b981">5. Output: Graph + CSV Data Log</text>
    </g>
  </g>

  <!-- Footnote -->
  <g transform="translate(60, 520)">
    <rect width="880" height="70" rx="8" fill="#111827" stroke="#1e293b" />
    <text x="24" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">CALIBRATION CONSTANTS IN CODE:</text>
    <text x="24" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e0">
      DEFAULT_CALIBRATION = ((72, 405), (304, 532)) // 405nm Violet &amp; 532nm Green DPSS reference points
    </text>
  </g>
</svg>