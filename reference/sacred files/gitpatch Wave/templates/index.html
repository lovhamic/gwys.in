<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git:Patch Wave</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE THEME --- */
        :root {
            --bg-color: #0d1117; /* GitHub Dark Dim */
            --panel-color: rgba(22, 27, 34, 0.85);
            --accent: #58a6ff;   /* Git Blue */
            --accent-glow: rgba(88, 166, 255, 0.4);
            --text-main: #c9d1d9;
            --grid-line: rgba(255, 255, 255, 0.08);
        }

        body { 
            margin: 0; background-color: var(--bg-color); 
            background-image: radial-gradient(circle at 50% 50%, #161b22 0%, #0d1117 100%);
            color: var(--text-main); 
            font-family: 'Rajdhani', sans-serif; 
            height: 100vh; overflow: hidden; display: flex; 
        }

        /* --- 2. LOADING SCREEN --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-out;
        }
        .loader-text {
            font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; color: var(--accent);
            margin-top: 20px; letter-spacing: 2px;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(88, 166, 255, 0.3);
            border-radius: 50%; border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* --- SIDEBAR --- */
        #sidebar {
            width: 380px; background: var(--panel-color); backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255,255,255,0.1); padding: 25px; 
            display: flex; flex-direction: column; gap: 20px; z-index: 10;
        }

        h1 { 
            font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; 
            color: var(--accent); margin: 0; display: flex; align-items: center; gap: 10px; 
        }
        h2 { 
            font-size: 0.9rem; color: #8b949e; text-transform: uppercase; 
            letter-spacing: 2px; font-weight: 700; border-bottom: 1px solid #30363d; padding-bottom: 5px; margin-bottom: 10px;
        }

        /* Dynamic Lists */
        .dynamic-list { display: flex; flex-direction: column; gap: 8px; }
        .item-row { 
            display: flex; gap: 10px; align-items: center; background: #0d1117; 
            border: 1px solid #30363d; padding: 8px; border-radius: 6px; 
        }
        
        /* Inputs */
        input[type="text"] {
            width: 100%; background: transparent; border: none; outline: none;
            color: #e6edf3; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
        }
        
        /* Buttons */
        .btn-add {
            width: 100%; padding: 10px; background: rgba(88, 166, 255, 0.1); border: 1px dashed rgba(88, 166, 255, 0.3); 
            color: var(--accent); border-radius: 4px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; transition: 0.2s;
        }
        .btn-add:hover { background: rgba(88, 166, 255, 0.2); }
        .btn-del { background: none; border: none; color: #ff7b72; cursor: pointer; font-weight: bold; }

        /* Sliders */
        input[type="range"] { flex-grow: 1; accent-color: var(--accent); }

        /* Superposition Box */
        .super-box {
            background: linear-gradient(90deg, rgba(88,166,255,0.05), transparent);
            border-left: 3px solid var(--accent); padding: 10px; border-radius: 0 4px 4px 0;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Canvas */
        canvas { flex-grow: 1; cursor: crosshair; }
        
        /* Overlay Data */
        #overlay { 
            position: absolute; bottom: 20px; right: 20px; 
            font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; 
            color: rgba(255,255,255,0.4); pointer-events: none; 
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">> INITIALIZING GIT:PATCH...</div>
    </div>

    <div id="sidebar">
        <h1><span style="font-size:1.4rem;">⑂</span> Git:Patch Wave</h1>

        <div>
            <h2>Functions</h2>
            <div id="eq-list" class="dynamic-list"></div>
            <button class="btn-add" onclick="addEquation()">+ New Branch (Eq)</button>
        </div>

        <div>
            <h2>Parameters</h2>
            <div id="var-list" class="dynamic-list"></div>
            <button class="btn-add" onclick="addVariable()">+ New Commit (Var)</button>
        </div>

        <div class="super-box">
            <span style="font-family:'JetBrains Mono'; font-size:0.8rem;">MERGE WAVES (SUM)</span>
            <input type="checkbox" id="superposition-mode" onchange="manualPlot()" style="width:20px; height:20px; accent-color:#58a6ff;">
        </div>

        <div style="margin-top:auto; border-top:1px solid #30363d; padding-top:15px; display:flex; gap:15px;">
            <label style="font-size:0.9rem; display:flex; align-items:center; gap:5px;">
                <input type="checkbox" id="animate-mode" onchange="toggleAnimation()"> Live Exec
            </label>
            <label style="font-size:0.9rem; display:flex; align-items:center; gap:5px;">
                <input type="checkbox" id="grid-mode" checked onchange="manualPlot()"> Grid Mesh
            </label>
        </div>
    </div>

    <canvas id="plotCanvas"></canvas>
    <div id="overlay">
        COORD: <span id="mouse-coord">0.00, 0.00</span>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
